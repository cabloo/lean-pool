# UNENCRYPTED: plain HTTP to clients and to Lean servers, the API key included; render with TLS to encrypt.
# haproxy.cfg for a lean-pool, generated by leanpool-haproxy-config.
# Edit the server list and render again instead of editing this file.
#
# Pool: 2 Lean servers, 6 workers.
# Sized for checks with a Lean timeout of up to 60s:
#   a check may wait 150s in the queue for a free worker,
#   and a Lean server may take 210s to answer it.
# The cache must wait at least 360s for the checkers
# (LEANPOOL_CACHE_UPSTREAM_TIMEOUT_SECONDS).

global
    log stdout format raw local0
    # A failed check can be replayed on another server only if the whole request fits
    # in one buffer, so a buffer holds the largest check (HAProxy's default is 16384).
    tune.bufsize 262144
    # Larger buffers need fewer connections. Worst case for buffer memory:
    # 1024 connections x 3 buffers (request, response, the copy kept for a replay)
    # x 262144 bytes = 768 MiB. A check through the cache holds two connections.
    maxconn 1024

resolvers pool_dns
    # The name servers in /etc/resolv.conf of the machine or container HAProxy runs in.
    parse-resolv-conf
    # Every server name is looked up again each 10s, so a box whose address changed is followed.
    timeout resolve 10s
    # An unanswered query is repeated after 1s; after 3 queries the lookup has failed.
    timeout retry 1s
    resolve_retries 3
    # DNS says where a server is; only its health check says whether it is up. So a
    # failing lookup does not take a server out: it keeps its last address for 24 days,
    # close to the longest period HAProxy accepts.
    hold nx 24d
    hold refused 24d
    hold timeout 24d
    hold other 24d

defaults
    mode http
    log global
    option httplog
    # Wait for the whole request (or a full buffer) before choosing a server: HAProxy
    # can replay only a request it had completely received when it first sent it.
    option http-buffer-request
    timeout connect 5s
    timeout client 390s
    timeout server 210s
    timeout queue 150s
    timeout http-request 10s
    timeout http-keep-alive 60s

frontend lean_pool
    bind :18100
    acl is_health path /health
    acl is_check path /api/check /api/check/
    acl is_cache_status path /status
    acl is_second_hop req.hdr(X-Lean-Pool-Hop) -m found
    acl checkers_up nbsrv(checkers) gt 0
    # The cache server itself: nbsrv(cache) would also count its backup.
    acl cache_up srv_is_up(cache/cache)
    # What the pool says about itself, for clients that size themselves by it: the
    # workers on servers that are up, the checks waiting for a worker, and the servers
    # taking checks (up, and not drained by their usage agent).
    # Advisory: nothing here or behind reads these numbers back.
    http-request set-var(txn.pool_workers) int(0)
    http-request set-var(txn.pool_workers) srv_is_up(checkers/lean-a),mul(2),add(txn.pool_workers)
    http-request set-var(txn.pool_workers) srv_is_up(checkers/lean-b),mul(4),add(txn.pool_workers)
    # Answered here, so a health probe never queues behind proofs or needs the cache.
    http-request return status 200 content-type application/json lf-string '{"status":"ok","workers":%[var(txn.pool_workers)],"queued":%[queue(checkers)],"servers":%[nbsrv(checkers)]}' if METH_GET is_health checkers_up
    http-request return status 503 content-type application/json lf-string '{"status":"no Lean server is taking checks","workers":%[var(txn.pool_workers)],"queued":%[queue(checkers)],"servers":%[nbsrv(checkers)]}' if METH_GET is_health
    # The same three numbers on every answer that leaves this door, summed again as the
    # answer leaves: a check may have waited minutes since its request was read.
    http-after-response set-var(res.pool_workers) int(0)
    http-after-response set-var(res.pool_workers) srv_is_up(checkers/lean-a),mul(2),add(res.pool_workers)
    http-after-response set-var(res.pool_workers) srv_is_up(checkers/lean-b),mul(4),add(res.pool_workers)
    http-after-response set-header X-Lean-Pool-Workers %[var(res.pool_workers)]
    http-after-response set-header X-Lean-Pool-Queued %[queue(checkers)]
    http-after-response set-header X-Lean-Pool-Servers %[nbsrv(checkers)]
    # The cache's own counters. While it is down there are none to report, and its
    # backup (a Lean server) must not be asked for them.
    http-request return status 503 content-type application/json string '{"status":"the cache is down"}' if is_cache_status !cache_up
    use_backend cache if is_cache_status
    # A request that has already been through the cache is never sent to it again.
    use_backend checkers if is_second_hop
    # Only checks are cached; anything else a Lean server offers goes straight to one.
    use_backend checkers if !is_check
    # The cache is optional at run time: without it checks keep flowing, uncached.
    use_backend checkers if !cache_up
    default_backend cache

frontend checkers_door
    bind 127.0.0.1:18101
    http-request set-header X-Lean-Pool-Hop checkers
    default_backend checkers

backend cache
    option httpchk GET /health
    # The cache holds a request for the queue wait and the check together.
    timeout server 390s
    # Losing the cache must not fail a check. The first refused connection marks the
    # cache down, and the request that met it is sent again, to the backup. A request
    # the cache dropped unanswered takes two retries: one finds the cache gone, one
    # reaches the backup.
    retries 3
    retry-on conn-failure empty-response
    option redispatch
    default-server init-addr last,libc,none resolvers pool_dns resolve-prefer ipv4
    # No maxconn: checks queue in front of the Lean servers, not in front of the cache.
    server cache 127.0.0.1:18102 check inter 1s fall 2 rise 2 observe layer4 error-limit 1 on-error mark-down
    # This proxy's own loopback listener, which sets the loop-guard header and leads to
    # the Lean servers. Used only while the cache server is down.
    server checkers_door 127.0.0.1:18101 backup

backend checkers
    balance leastconn
    option httpchk GET /health
    # A check that failed without Lean's answer goes to another server: a failed or
    # dropped connection, a crashed worker (500) or a gateway error. At most 2 retries,
    # so a proof that crashes every worker it meets is stopped. A Lean timeout is an
    # HTTP 200 and is never retried.
    retries 2
    retry-on conn-failure empty-response 500 502 503 504
    option redispatch 1
    # Background work takes only the workers nobody else is waiting for: while every
    # worker is busy, a waiting background check is taken after every normal one. Here,
    # because this backend's queue is the one that forms, and both ways in pass this
    # rule. Any other value of the header, and no header, is a normal check.
    http-request set-priority-class int(100) if { req.hdr(X-Lean-Priority) -i -m str background }
    # A name that does not resolve when the proxy starts leaves that server down instead
    # of stopping the proxy, and every name is looked up again while the proxy runs.
    default-server init-addr last,libc,none resolvers pool_dns resolve-prefer ipv4
    server lean-a lean-a:8000 check maxconn 2 weight 128 agent-check agent-port 18200 agent-inter 5s
    server lean-b lean-b:8000 check maxconn 4 weight 256 agent-check agent-port 18200 agent-inter 5s

listen stats
    bind 127.0.0.1:18103
    stats enable
    stats uri /
    stats refresh 10s
