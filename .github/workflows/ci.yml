name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Named, so that a step fails when any command of a pipeline fails (bash -eo pipefail).
    shell: bash

jobs:
  test:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the project and its development tools
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  live:
    name: The generated configuration on a running HAProxy 3.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install HAProxy 3.0
        # The distribution's own package is an older branch; this is HAProxy's Debian and
        # Ubuntu packaging of 3.0. The service it starts is not needed.
        run: |
          sudo add-apt-repository -y ppa:vbernat/haproxy-3.0
          sudo apt-get update
          sudo apt-get install -y 'haproxy=3.0.*'
          sudo systemctl stop haproxy
          haproxy -v
      - name: Run every test, those that need HAProxy included
        # With HAProxy, curl and openssl installed no test may be skipped: -rs lists any that
        # was, and the second command fails the step if there is one.
        run: |
          uv run pytest -rs | tee pytest.log
          ! grep -E '^SKIPPED| skipped' pytest.log

  image:
    name: The image builds, and HAProxy accepts what the image renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run its commands from it
        run: |
          docker build -f deploy/Dockerfile -t lean-pool .
          for command in leanpool-cache leanpool-agent leanpool-haproxy-config leanpool-admit \
                         leanpool-pki leanpool-join; do
            docker run --rm lean-pool "$command" --help > /dev/null
          done
      - name: Render two configurations
        # One pool given by address, and one whose names never resolve (".invalid" is reserved
        # for that): an unresolvable server must not stop the proxy from starting.
        run: |
          mkdir rendered && chmod 0755 rendered
          printf 'lean-a 192.0.2.10:8000 4\nlean-b 192.0.2.20:8000 8 18250\n' > rendered/by-address
          printf 'lean-a lean-a.invalid:8000 4\nlean-b 192.0.2.20:8000 8\n' > rendered/by-name
          render() { docker run --rm -v "$PWD/rendered:/rendered:ro" lean-pool leanpool-haproxy-config render "$@"; }
          render --servers /rendered/by-address > rendered/by-address.cfg
          render --servers /rendered/by-name --cache-address cache.invalid:18102 > rendered/by-name.cfg
      - name: Validate both with the HAProxy image the compose files run
        # The demo's committed configuration is validated with them.
        run: |
          cp examples/demo/haproxy.cfg rendered/demo.cfg
          for config in by-address.cfg by-name.cfg demo.cfg; do
            docker run --rm --network none -v "$PWD/rendered:/cfg:ro" \
              haproxy:3.0 haproxy -c -f "/cfg/$config"
          done

  demo:
    name: The demo in Docker, and its walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker validates every compose file
        run: |
          docker compose -f examples/demo/compose.yaml config --quiet
          cd deploy/pool
          touch api-key.txt
          LEANPOOL_CACHE_PIN=ci docker compose -f compose.yaml config --quiet
          LEANPOOL_CACHE_PIN=ci docker compose -f compose.yaml -f compose.tls.yaml config --quiet
          cd ../lean-server
          export LEAN_SERVER_API_KEY=ci LEAN_SERVER_MAX_REPLS=2
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.tls.yaml config --quiet
      - name: Start the demo
        run: docker compose -f examples/demo/compose.yaml up --build -d
      - name: Walk through it
        run: examples/demo/walkthrough.sh
      - name: What the demo's containers logged
        if: always()
        run: docker compose -f examples/demo/compose.yaml logs --no-color --tail 200
      - name: Stop the demo
        if: always()
        run: docker compose -f examples/demo/compose.yaml down -v
