name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Named, so that a step fails when any command of a pipeline fails (bash -eo pipefail).
    shell: bash

jobs:
  test:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # All of the history: the installer tests set up a box with the installers of an older commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the project and its development tools
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: The kernel the worker sandbox's tests run on
        # tests/test_worker_sandbox.py shows the walls of this kernel's Landlock version, and skips
        # without one: say which, where the run's page shows it.
        run: |
          probe=$(python3 -I -S -B deploy/lean-server/worker-sandbox/sandbox.py --probe 2>&1 || true)
          echo "::notice title=Worker sandbox::Linux $(uname -r): ${probe}"
      - name: Tests
        # Each test that fails is also written as an annotation, which the run's page shows
        # without a sign-in.
        run: |
          status=0
          COLUMNS=1000 uv run pytest -rfE 2>&1 | tee pytest.log || status=$?
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-900 | while IFS= read -r line; do
            echo "::error title=pytest::${line//%/%25}"
          done || true
          exit "$status"

  live:
    name: The generated configuration on a running HAProxy 3.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install HAProxy 3.0
        # The distribution's own package is an older branch; this is HAProxy's Debian and
        # Ubuntu packaging of 3.0. The service it starts is not needed.
        run: |
          sudo add-apt-repository -y ppa:vbernat/haproxy-3.0
          sudo apt-get update
          sudo apt-get install -y 'haproxy=3.0.*'
          sudo systemctl stop haproxy
          haproxy -v
      - name: Run every test, those that need HAProxy included
        # With HAProxy, curl and openssl installed no test may be skipped: -rs lists any that
        # was, and the second command fails the step if there is one. The installer tests run
        # in the job above, and the tests marked `lean` need a real Lean, which this job has not.
        run: |
          uv run pytest -rs -m "not lean" --ignore=tests/install | tee pytest.log
          ! grep -E '^SKIPPED| skipped' pytest.log

  image:
    name: The image builds, and HAProxy accepts what the image renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run its commands from it
        run: |
          docker build -f deploy/Dockerfile -t lean-pool .
          for command in leanpool-cache leanpool-agent leanpool-haproxy-config leanpool-admit \
                         leanpool-pki leanpool-join; do
            docker run --rm lean-pool "$command" --help > /dev/null
          done
      - name: Render two configurations
        # One pool given by address, and one whose names never resolve (".invalid" is reserved
        # for that): an unresolvable server must not stop the proxy from starting.
        run: |
          mkdir rendered && chmod 0755 rendered
          printf 'lean-a 192.0.2.10:8000 4\nlean-b 192.0.2.20:8000 8 18250\n' > rendered/by-address
          printf 'lean-a lean-a.invalid:8000 4\nlean-b 192.0.2.20:8000 8\n' > rendered/by-name
          render() { docker run --rm -v "$PWD/rendered:/rendered:ro" lean-pool leanpool-haproxy-config render "$@"; }
          render --servers /rendered/by-address > rendered/by-address.cfg
          render --servers /rendered/by-name --cache-address cache.invalid:18102 > rendered/by-name.cfg
      - name: Validate both with the HAProxy image the compose files run
        # The demo's committed configuration is validated with them.
        run: |
          cp examples/demo/haproxy.cfg rendered/demo.cfg
          for config in by-address.cfg by-name.cfg demo.cfg; do
            docker run --rm --network none -v "$PWD/rendered:/cfg:ro" \
              haproxy:3.0 haproxy -c -f "/cfg/$config"
          done

  demo:
    name: The demo in Docker, and its walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker validates every compose file
        run: |
          docker compose -f examples/demo/compose.yaml config --quiet
          cd deploy/pool
          touch api-key screened-api-key
          export LEANPOOL_CACHE_PIN=ci LEANPOOL_DNS=192.0.2.53 LEANPOOL_SCREENED_DOOR_ADDRESS=172.17.0.1 LEANPOOL_CACHE_SCREENED_IN_FLIGHT=4
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.tls.yaml config --quiet
          docker compose -f compose.yaml -f compose.tls.yaml -f compose.dns.yaml config --quiet
          docker compose -f compose.yaml -f compose.tls.yaml -f compose.dns.yaml -f compose.screened-door.yaml config --quiet
          cd ../lean-server
          export LEAN_SERVER_API_KEY=ci LEAN_SERVER_MAX_REPLS=2
          mkdir -p native sandbox
          for files in "compose.yaml" \
                       "compose.yaml compose.agent.yaml" \
                       "compose.yaml compose.agent.yaml compose.tls.yaml" \
                       "compose.yaml compose.compiled-search.yaml" \
                       "compose.yaml compose.agent.yaml compose.compiled-search.yaml" \
                       "compose.yaml compose.agent.yaml compose.tls.yaml compose.compiled-search.yaml" \
                       "compose.yaml compose.worker-sandbox.yaml" \
                       "compose.yaml compose.agent.yaml compose.tls.yaml compose.compiled-search.yaml compose.worker-sandbox.yaml"; do
            docker compose $(printf -- '-f %s ' $files) config --quiet
          done
      - name: Docker merges the overlays as the tests' model of Compose does
        working-directory: deploy/lean-server
        env:
          LEAN_SERVER_API_KEY: ci
          LEAN_SERVER_MAX_REPLS: "2"
          LEAN_SERVER_PUBLISHED_PORT: "18001"
        run: |
          docker compose -f compose.yaml -f compose.agent.yaml -f compose.tls.yaml config --format json > tls.json
          # With TLS the front alone publishes, and the ports inside stay fixed.
          test "$(jq -c '.services.kimina.ports // []' tls.json)" = "[]"
          test "$(jq -c '.services.agent.ports // []' tls.json)" = "[]"
          test "$(jq -r '.services.front.ports[] | "\(.published):\(.target)"' tls.json | sort | tr '\n' ' ')" = "18001:8000 18200:18200 "
          test "$(jq -r '.name' tls.json)" = "lean-server"
      - name: Start the demo
        run: docker compose -f examples/demo/compose.yaml up --build -d
      - name: Walk through it
        run: examples/demo/walkthrough.sh
      - name: What the demo's containers logged
        if: always()
        run: docker compose -f examples/demo/compose.yaml logs --no-color --tail 200
      - name: Stop the demo
        if: always()
        run: docker compose -f examples/demo/compose.yaml down -v
