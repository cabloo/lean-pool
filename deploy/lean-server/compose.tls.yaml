# A Lean server box with TLS, added after compose.yaml and compose.agent.yaml:
#
#   docker compose -f compose.yaml -f compose.agent.yaml -f compose.tls.yaml up -d
#
# The server and the usage agent then publish nothing themselves. A TLS front (HAProxy in TCP mode, the same
# image as the pool's proxy) stands on their two ports, lets in only the pool proxy's client certificate, and
# passes what it accepts to them unchanged over this project's own network. docs/tls.md says who holds which
# key. This file expects, beside it:
#
#   tls/box.pem           this box's certificate followed by its private key, readable by HAProxy's group only
#   tls/ca.crt            the pool authority's certificate
#   front/haproxy.cfg     the front's configuration:
#
#   leanpool-haproxy-config render-box \
#       --tls-server-pem /etc/leanpool/tls/box.pem --tls-ca-file /etc/leanpool/tls/ca.crt \
#       --proxy-client-name lean-pool-proxy \
#       --lean-upstream kimina:8000 --agent-upstream agent:18200 > front/haproxy.cfg

services:
  kimina:
    # Not published: between the front and the server, checks are plain, so that hop stays on this project's
    # own network.
    ports: !reset []

  agent:
    ports: !reset []

  front:
    image: "${LEAN_SERVER_FRONT_IMAGE:-haproxy:3.0}"
    restart: unless-stopped
    ports:
      # The ports the server and the agent would publish themselves. IPv4 only, as theirs.
      - "0.0.0.0:${LEAN_SERVER_PUBLISHED_PORT:-8000}:8000"
      - "0.0.0.0:${LEAN_SERVER_AGENT_PORT:-18200}:18200"
    volumes:
      # Directories, not files: a new config or certificate is moved into place and HAProxy told to reload
      # from inside the container (`kill -HUP 1`). Never `docker kill -s HUP`: Docker counts a container it
      # signalled as stopped by hand, and `restart: unless-stopped` would then not bring it back after a reboot.
      - ./front:/usr/local/etc/haproxy:ro
      - ./tls:/etc/leanpool/tls:ro
    depends_on: [kimina, agent]
    networks:
      default:
        # Fixed: a firewall that blocks connections starting from this network can let this one address out,
        # to the server and the agent beside it. The server still starts none.
        ipv4_address: "${LEAN_SERVER_FRONT_ADDRESS:-172.29.53.250}"
    read_only: true
    tmpfs: ["/tmp", "/run"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
