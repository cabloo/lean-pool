# TLS for the pool box: used on top of compose.yaml,
#
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
#
# with haproxy/haproxy.cfg rendered in TLS mode. docs/tls.md walks through it (step 6):
#
#   leanpool-haproxy-config render --servers servers \
#       --tls-front-door-pem /etc/leanpool/tls/front.pem \
#       --tls-ca-file /etc/leanpool/tls/ca.crt \
#       --tls-client-pem /etc/leanpool/tls/proxy-client.pem > haproxy/haproxy.cfg
#
# ./pki/proxy is where that page has leanpool-pki write front.pem (the front door's certificate
# and key), proxy-client.pem (what the proxy shows every Lean server) and ca.crt. The two .pem
# files hold private keys: let the group HAProxy's image runs as read them, and nobody else:
#
#   gid=$(docker run --rm --network none --entrypoint id haproxy:3.0 -g)
#   sudo chgrp "$gid" pki/proxy pki/proxy/*.pem && chmod 0750 pki/proxy && chmod 0640 pki/proxy/*.pem
#
# The authority's own key is in ./pki/ca, which no container mounts.

services:
  haproxy:
    volumes:
      - ./pki/proxy:/etc/leanpool/tls:ro
