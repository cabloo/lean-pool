# TLS for the pool box, added after compose.yaml:
#
#   docker compose -f compose.yaml -f compose.tls.yaml up -d
#
# with haproxy/haproxy.cfg rendered in TLS mode:
#
#   leanpool-haproxy-config render --servers servers \
#       --tls-front-door-pem /etc/leanpool/tls/front.pem \
#       --tls-ca-file /etc/leanpool/tls/ca.crt \
#       --tls-client-pem /etc/leanpool/tls/proxy-client.pem > haproxy/haproxy.cfg
#
# ./tls holds front.pem (the front door's certificate and key), proxy-client.pem (what the proxy shows every
# Lean server) and ca.crt (the pool authority's certificate). The two .pem files hold private keys: the
# directory and they belong to the group HAProxy's image runs as, and nobody else may read them. The
# authority's own key is kept elsewhere, in a directory no container mounts. docs/tls.md says who holds which.

services:
  haproxy:
    volumes:
      - ./tls:/etc/leanpool/tls:ro
